schema: spec-driven

context: |
  Language: Simplified Chinese
  All artifacts must be written in Simplified Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  规格分级（2026-09-21 冻结探索期口径，2026-10-15 起逐步解冻）：对外契约类变更（协议 / 时机与事件清单 / 包与装载器）
  照常写 specs 增量、归档时合进 openspec/specs/；内核行为与内容口径类变更只做决策记录（proposal / design / tasks），
  并在 .openspec.yaml 设 skip_specs: true。openspec/specs/ 里探索期留下的历史快照不逐点维护，等一次性回顾性对齐。
githubCopilot:
  cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# It is separate from artifact rules above.
operations:
  apply:
    guidance:
      - 契约以用例为准：改完跑 server/bin/moe-kill.exe --test，全量用例 0 失败即可，不必回头改 openspec/specs/ 里的历史快照。
      - 对外契约类变更（协议 / 时机与事件清单 / 包与装载器）改了要同步 specs 增量，并三处一起动（实现 / proto.d.lua / 规格）。
  archive:
    guidance:
      - 内核行为与内容口径类变更没有 spec 增量（specs 是 skipped），归档时不会同步主规格：勾完 tasks 直接 archive 即可。
      - 对外契约类变更（有 specs 增量）归档会把增量合进 openspec/specs/；归档后核对主规格 Purpose 不是占位文字。

# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
